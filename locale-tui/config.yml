# locale-tui configuration file

# Project root path (relative to the locale-tui directory)
project_root: ".."

# Module configuration
modules:
  - name: "app"
    res_path: "app/src/main/res"
    source_patterns:
      - "app/src/main/java/**/*.kt"
      - "app/src/main/java/**/*.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/xml/*.xml"
  - name: "ai"
    res_path: "ai/src/main/res"
    source_patterns:
      - "ai/src/main/java/**/*.kt"
      - "ai/src/main/java/**/*.java"
  - name: "highlight"
    res_path: "highlight/src/main/res"
    source_patterns:
      - "highlight/src/main/java/**/*.kt"
      - "highlight/src/main/java/**/*.java"
      - "highlight/src/main/AndroidManifest.xml"
  - name: "search"
    res_path: "search/src/main/res"
    source_patterns:
      - "search/src/main/java/**/*.kt"
      - "search/src/main/java/**/*.java"
      - "search/src/main/AndroidManifest.xml"
  - name: "oauth"
    res_path: "oauth/src/main/res"
    source_patterns:
      - "oauth/src/main/java/**/*.kt"
      - "oauth/src/main/AndroidManifest.xml"
  - name: "rag"
    res_path: "rag/src/main/res"
    source_patterns:
      - "rag/src/main/java/**/*.kt"
      - "rag/src/main/java/**/*.java"
      - "rag/src/main/AndroidManifest.xml"

# Supported languages
languages:
  - code: "values"
    name: "English"
    is_source: true
  - code: "values-ja"
    name: "Japanese"
  - code: "values-ko-rKR"
    name: "Korean"
  - code: "values-ru"
    name: "Russian"
  - code: "values-ar"
    name: "Arabic"
    # Use the basic form without the article; the model inflects it grammatically
    glossary:
      prompt: "مطالبة (plural مطالبات); never موجه"
      system prompt: "مطالبة النظام"
      prompt injection: "حقن مطالبات (definite: حقن المطالبات)"
      mode injection: "حقن أوضاع (definite: حقن الأوضاع)"
      lorebook: "كتاب معرفة (plural كتب معرفة; add ال only where grammar requires); never leave Lorebook in English"
      provider: "مزوّد (plural مزوّدون / مزوّدي); never موفر"
      context: "سياق"
      model: "نموذج"
      assistant: "مساعد"
      agent: "وكيل"
      tool: "أداة"
      reasoning: "استدلال"
      thinking: "تفكير"
      workspace: "مساحة عمل"
      skill: "مهارة"
      extension: "إضافة"
      memory: "ذاكرة"
      quick message: "رسالة سريعة"

# AI translation configuration
translation:
  batch_size: 10
  model: "deepseek-v4-flash"
  prompt_template: |
    You are a professional translator specializing in mobile app localization.

    App context: This is an AI LLM chat client app that allows users to chat with AI models from various providers (OpenAI, Anthropic, Google, DeepSeek, etc.). The UI strings contain AI/LLM-specific terminology that must be translated accurately.

    Translate the following Android app string resources from English to {target_language}.

    Important guidelines:
    1. Preserve all Android string placeholders like %1$s, %1$d, %s, %d exactly as they are
    2. Keep special characters like \n, \', &amp;, etc.
    3. Maintain the same tone and style (formal/informal) as the source
    4. For UI text, keep it concise
    5. Do not translate brand names or technical terms that should remain in English (e.g. OpenAI, Anthropic, Token, API)
    6. Use established AI/LLM terminology in the target language

    Source strings (JSON format):
    {source_strings}

    Respond with a JSON object mapping the same keys to translated values.
    Only output the JSON, no other text.

# Display settings
display:
  column_widths:
    key: 30
    translation: 25
  page_size: 50
