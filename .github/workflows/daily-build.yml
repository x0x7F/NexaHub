name: Daily Build

on:
  # Runs daily at 09:00 and 18:00 UTC
  schedule:
    - cron: '0 9,18 * * *'
  # Can also be triggered manually
  workflow_dispatch:

jobs:
  # Check for new commits in the last 24 hours; skip the build if there are none to avoid duplicate builds
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # Always build when triggered manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled: only build if there were new commits in the last 24 hours
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new commits in the last 24 hours, skipping build"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Publishing a release needs write access

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # Fetch submodules

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The web module's preBuild runs `pnpm run build` to build the frontend, so Node + pnpm must be set up
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # Gradle's buildWebUi task only runs build, not install, so install dependencies here first
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # Decode the base64-encoded keystore file
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # Write the signing config to local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties


      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Publish the APK directly as a prerelease so users can download a single APK from a link, without logging in or unzipping
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # Fixed tag; each night overwrites the same "latest nightly build"
          name: Nightly Build
          prerelease: true
          body: |
            Automated nightly build (commit `${{ github.sha }}`)

            > ⚠️ Development build; may be unstable, for testing only.
          files: app/build/outputs/apk/release/*.apk
